      - region "§07 · Methodology" [ref=e364]:
        - paragraph [ref=e365]: §07 · Methodology
        - paragraph [ref=e366]: How the metrics scores are computed.
        - generic [ref=e367]:
          - generic [ref=e368]:
            - paragraph [ref=e369]: Scoring framework
            - heading "Four principles govern the Kraken scoring system." [level=2] [ref=e370]
          - generic [ref=e371]:
            - article [ref=e372]:
              - paragraph [ref=e373]: Principle 01
              - heading "Speedup Ratio (SR)" [level=4] [ref=e374]
              - list [ref=e375]:
                - listitem [ref=e376]: · SR = Speedup_LM / Speedup_Gold
                - listitem [ref=e377]: · A score of 1.0 means the agent matched the expert
                - listitem [ref=e378]: · Values above 1.0 indicate the agent exceeded expert performance
            - article [ref=e379]:
              - paragraph [ref=e380]: Principle 02
              - heading "Harmonic Mean" [level=4] [ref=e381]
              - list [ref=e382]:
                - listitem [ref=e383]: · Individual SR values aggregated via harmonic mean
                - listitem [ref=e384]: · Penalizes inconsistency across instances
                - listitem [ref=e385]: · Prevents a single outlier from inflating the score
            - article [ref=e386]:
              - paragraph [ref=e387]: Principle 03
              - heading "Correctness Gating" [level=4] [ref=e388]
              - list [ref=e389]:
                - listitem [ref=e390]: · Patches must pass Covering Test Suite (CTS)
                - listitem [ref=e391]: "· Failed patches penalized: SR = 1/Gold_Speedup"
                - listitem [ref=e392]: · Correctness is never sacrificed for speed
            - article [ref=e393]:
              - paragraph [ref=e394]: Principle 04
              - heading "Pass@1 Protocol" [level=4] [ref=e395]
              - list [ref=e396]:
                - listitem [ref=e397]: · Each model gets exactly one attempt per instance
                - listitem [ref=e398]: · Mirrors real-world single-submission workflow
                - listitem [ref=e399]: · No retry, no cherry-picking best runs
