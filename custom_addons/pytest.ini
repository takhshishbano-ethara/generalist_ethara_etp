[pytest]
testpaths = aurora/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -q --ignore=aurora/tests/test_credential_manager.py --ignore=aurora/tests/test_evaluation.py --ignore=aurora/tests/test_evaluation_executor.py --ignore=aurora/tests/test_expanded.py --ignore=aurora/tests/test_github_token.py --ignore=aurora/tests/test_import_tokens_wizard.py --ignore=aurora/tests/test_pool_metrics.py
