  # ============================================================
  # WhatsApp Webhook
  # ============================================================
  /whatsapp_groups/webhook:
    get:
      tags: [WhatsApp Webhook]
      summary: Webhook verification (Meta)
      description: Handles Meta's webhook verification challenge for WhatsApp Cloud API.
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            example: subscribe
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Challenge echoed back
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Bad request
        '403':
          description: Invalid verify token
    post:
      tags: [WhatsApp Webhook]
      summary: Receive webhook events
      description: |
        Receives webhook events from Meta WhatsApp Cloud API.
        Supported events: group_lifecycle_update, group_participants_update, group_settings_update, group_status_update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entry:
                  type: array
                  items:
                    type: object
                    properties:
                      changes:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              enum:
                                - group_lifecycle_update
                                - group_participants_update
                                - group_settings_update
                                - group_status_update
                            value:
                              type: object
      responses:
        '200':
          description: OK

