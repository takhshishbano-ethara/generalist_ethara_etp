openapi: 3.0.3
info:
  title: Ethara ETP API
  description: |
    REST API documentation for Ethara ETP platform.

    ## Authentication
    Most endpoints require a custom token-based authentication.
    - Call `POST /api/v1/auth_token` to get an `access_token` and `refresh_token`.
    - Pass the `access_token` in the request header for all protected endpoints.
    - When the access token expires, call `POST /api/v1/refresh_token` with the `refresh_token`.

    ## Response Format
    All responses follow this structure:
    ```json
    {
      "message": "Success",
      "status_code": 200,
      "errors": []
    }
    ```
