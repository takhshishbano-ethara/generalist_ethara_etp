  /api/get_jsonl_data:
    post:
      tags: [Valor, Preference Ranking]
      summary: Import JSONL evaluation data
      description: |
        Fetch a JSONL file from the given URL, randomize response pairs, and create evaluation records.
        Used by both Valor and Preference Ranking modules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonlImportRequest'
      responses:
        '200':
          description: Data imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  records_created:
                    type: integer
                  records_queued:
                    type: integer
                  status:
                    type: integer
        '400':
          description: Missing or empty URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer

  /api/get_llm_response:
    get:
      tags: [Valor, Preference Ranking]
      summary: Trigger LLM evaluation pipeline
      description: |
        Fetch model router configuration and trigger background LLM evaluation
        for all unprocessed records. Used by both Valor and Preference Ranking modules.
      responses:
        '200':
          description: Pipeline triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error_list:
                    type: array
                    items:
