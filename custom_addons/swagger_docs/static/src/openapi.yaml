      properties:
        url:
          type: string
          format: uri
          description: URL to a JSONL file containing evaluation data

paths:
  # ============================================================
  # Authentication
  # ============================================================
  /api/v1/auth_token:
    post:
      tags: [Authentication]
      summary: Login and get access token
      description: Authenticate with login/password and receive access + refresh tokens along with user details and role permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid credentials or deactivated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/refresh_token:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access + refresh token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth_token_unlink:
    get:
      tags: [Authentication]
      summary: Logout (delete access token)
      description: Delete the current access token to log out.
      parameters:
        - name: access_token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Missing access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sign_out_all_session:
    get:
      tags: [Authentication]
      summary: Sign out all sessions
      description: Delete all access tokens for the current user, logging out all sessions.
      security:
        - AccessToken: []
      responses:
        '200':
          description: All sessions signed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  # ============================================================
  # User Profile
  # ============================================================
  /api/v1/get_logged_user_details:
    get:
      tags: [User Profile]
      summary: Get current user details
      description: Returns full profile of the logged-in user including skills, projects, notification preferences, and appearance settings.
      security:
        - AccessToken: []
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        $ref: '#/components/schemas/UserDetails'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/update_profile_information:
    post:
      tags: [User Profile]
      summary: Update user profile
      description: Update profile fields like name, email, mobile, bio, location, profile picture.
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/change_users_password:
    post:
      tags: [User Profile]
      summary: Change user password
      description: Change the current user's password. Requires old password verification.
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Password mismatch or incorrect old password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/get_menu_list:
    get:
      tags: [User Profile]
      summary: Get role-based menu list
      description: Returns the hierarchical menu/permission tree for the current user's role.
      security:
        - AccessToken: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Filter by menu item ID
      responses:
        '200':
          description: Menu list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      permissions:
                        type: array
                        items:
                          $ref: '#/components/schemas/MenuItem'

  # ============================================================
  # Notifications
  # ============================================================
  /api/v1/create_notification:
    post:
      tags: [Notifications]
      summary: Create a notification
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreateRequest'
      responses:
        '200':
          description: Notification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/v1/update_notification:
    post:
      tags: [Notifications]
      summary: Update a notification (mark as read)
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUpdateRequest'
      responses:
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/v1/get_notification:
    get:
      tags: [Notifications]
      summary: Get notifications (paginated)
      description: Retrieve notifications for the current user. Supports pagination and filtering by priority, read status, and ID.
      security:
        - AccessToken: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: id
          in: query
          schema:
            type: integer
          description: Filter by notification ID
        - name: priority
          in: query
          schema:
            type: string
            enum: ["1", "2", "3"]
        - name: status
          in: query
          schema:
            type: string
            enum: [read, unread]
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        type: array
                        items:
                          $ref: '#/components/schemas/NotificationItem'
                      record_count:
                        type: integer
                      read_message_count:
                        type: integer
                      unread_message_count:
                        type: integer

  # ============================================================
  # Employees & Members
  # ============================================================
  /api/v1/get_employee_list:
    get:
      tags: [Employees & Members]
      summary: Get employee list (paginated)
      description: List employees with optional filtering by designation and search.
      security:
        - AccessToken: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: designation
          in: query
          schema:
            type: string
            enum: [se, aire, pl, qc_review, tasker]
          description: Filter by designation shortcode
        - name: designation_id
          in: query
          schema:
            type: integer
          description: Filter by designation record ID
        - name: search
          in: query
          schema:
            type: string
          description: Search by employee name
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmployeeItem'
                      total_record_count:
                        type: integer
                      count:
                        type: integer

  /api/v1/add_whatsapp_members:
    post:
      tags: [Employees & Members]
      summary: Add a WhatsApp group member
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppMemberRequest'
      responses:
        '200':
          description: Member added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        $ref: '#/components/schemas/WhatsAppMemberItem'

  /api/v1/get_whatsapp_member_list:
    get:
      tags: [Employees & Members]
      summary: Get WhatsApp members list (paginated)
      security:
        - AccessToken: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, email, or phone
      responses:
        '200':
          description: Members list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        type: array
                        items:
                          $ref: '#/components/schemas/WhatsAppMemberItem'
                      total_record_count:
                        type: integer
                      count:
                        type: integer

  # ============================================================
  # Projects
  # ============================================================
  /api/v1/create_project_record:
    post:
      tags: [Projects]
      summary: Create a new project
      description: Create a project with optional file attachments. Supports multipart/form-data for file uploads.
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                internal_project_name:
                  type: string
                client_name:
                  type: string
                project_category:
                  type: string
                project_type:
                  type: string
                sample_task_number:
                  type: integer
                  default: 0
                project_lead:
                  type: string
                  description: "Comma-separated IDs or JSON array, e.g. [1,2,3]"
                project_aire:
                  type: string
                  description: "Comma-separated IDs or JSON array"
                project_swe:
                  type: string
                  description: "Comma-separated IDs or JSON array"
                kick_off_to_mails:
                  type: string
                kick_off_subject:
                  type: string
                kick_off_body:
                  type: string
                ai_generated_description:
                  type: string
                internal_client_name:
                  type: string
                date_start:
                  type: string
                  format: date
                date_end:
                  type: string
                  format: date
                description:
                  type: string
                whatsapp_group_name:
                  type: string
                whatsapp_group_members:
                  type: string
                  description: "JSON array of {name, email, mobile}"
                slack_channel_name:
                  type: string
                slack_members:
                  type: string
                  description: "Comma-separated IDs or JSON array"
                save_as_draft:
                  type: string
                  enum: ["0", "1"]
                  description: "1 to save as draft"
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: File attachments
      responses:
        '200':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      project_id:
                        type: integer

  /api/v1/update_project_record:
    post:
      tags: [Projects]
      summary: Update an existing project
      description: Update project fields and optionally upload new file attachments.
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: Project ID to update
                name:
                  type: string
                internal_project_name:
                  type: string
                client_name:
                  type: string
                project_category:
                  type: string
                project_type:
                  type: string
                sample_task_number:
                  type: integer
                project_lead:
                  type: string
                project_aire:
                  type: string
                project_swe:
                  type: string
                kick_off_to_mails:
                  type: string
                kick_off_subject:
                  type: string
                kick_off_body:
                  type: string
                ai_generated_description:
                  type: string
                internal_client_name:
                  type: string
                date_start:
                  type: string
                  format: date
                date_end:
                  type: string
                  format: date
                description:
                  type: string
                whatsapp_group_name:
                  type: string
                slack_channel_name:
                  type: string
                slack_members:
                  type: string
                stage_id:
                  type: integer
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      project_id:
                        type: integer
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/get_project_list:
    get:
      tags: [Projects]
      summary: Get project list (paginated, filterable)
      security:
        - AccessToken: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
          description: Search by project name or internal name
        - name: status
          in: query
          schema:
            type: string
          description: "Comma-separated stage IDs, e.g. 1,2,3"
        - name: client
          in: query
          schema:
            type: string
          description: Filter by client name
        - name: type
          in: query
          schema:
            type: string
          description: Filter by project type
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectListItem'
                      total_record_count:
                        type: integer
                      count:
                        type: integer

  /api/v1/get_project_detail_view:
    get:
      tags: [Projects]
      summary: Get project detail view
      security:
        - AccessToken: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        $ref: '#/components/schemas/ProjectDetailRecord'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/get_project_status:
    get:
      tags: [Projects]
      summary: Get project stages grouped by phase
      security:
        - AccessToken: []
      responses:
        '200':
          description: Stages grouped by phase label
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectStageGroup'
                      total_record_count:
                        type: integer
                      count:
                        type: integer

  /api/v1/get_project_customer_list:
    get:
      tags: [Projects]
      summary: Get unique customer names
      description: Returns a deduplicated list of all client names across projects.
      security:
        - AccessToken: []
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        type: array
                        items:
                          type: string

  /api/v1/get_task_template_type:
    get:
      tags: [Projects]
      summary: Get task template types
      security:
        - AccessToken: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Template type list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      record:
                        type: array
                        items:
                          $ref: '#/components/schemas/TaskTemplateTypeItem'
                      total_record_count:
                        type: integer
                      count:
                        type: integer

  # ============================================================
  # Project Portal (PL / AIRE / SWE)
  # ============================================================
  /api/v1/update_project_details_pl_portal_info:
    post:
      tags: [Project Portal]
      summary: Update PL portal info
      description: Update project lead portal details including QC reviewers, taskers, meeting, and guideline files.
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - project_id
              properties:
                project_id:
                  type: string
                project_qc_reviewer:
                  type: array
                  items:
                    type: integer
                project_tasker:
                  type: array
                  items:
                    type: integer
                meeting_body:
                  type: string
                  description: "JSON object with subject, start_datetime, stop_datetime, description"
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Guideline files
      responses:
        '200':
          description: PL portal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/update_project_details_aire_portal_info:
    post:
      tags: [Project Portal]
      summary: Update AIRE portal info
