components:
  securitySchemes:
    AccessToken:
      type: apiKey
      in: header
      name: access_token
      description: Access token obtained from /api/v1/auth_token

  schemas:
    StandardResponse:
      type: object
      properties:
        message:
          type: string
          example: Success
        status_code:
          type: integer
          example: 200
        errors:
          type: array
          items:
            type: string
          example: []

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Something Went Wrong.
        status_code:
          type: integer
          example: 400
        errors:
          type: array
          items:
            type: string

    AuthTokenRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          example: admin@example.com
        password:
          type: string
          example: password123
        browser_name:
          type: string
          example: Chrome
        os_name:
          type: string
          example: Windows
        location:
          type: string
          example: Mumbai, India

    AuthTokenResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                uid:
                  type: integer
                  example: 2
                email:
                  type: string
                  example: admin@example.com
                name:
                  type: string
                  example: John Doe
                mobile:
                  type: string
                  example: "9876543210"
                access_token:
                  type: string
                  example: abc123xyz
                refresh_token:
                  type: string
                  example: ref456abc
                address:
                  type: string
                  example: "123 Street, Mumbai, 400001, Maharashtra, India"
                user_role:
                  type: string
                  example: Admin
                profile_pic:
                  type: string
                  example: ""
                permissions:
                  type: array
                  items:
                    $ref: '#/components/schemas/MenuItem'

    MenuItem:
      type: object
      properties:
        id:
          type: string
          example: dashboard
        is_visible:
          type: boolean
          example: true
        order:
          type: integer
          example: 1
        read:
          type: boolean
        write:
          type: boolean
        create:
          type: boolean
        delete:
          type: boolean
        child_list:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: ref456abc

    RefreshTokenResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string

