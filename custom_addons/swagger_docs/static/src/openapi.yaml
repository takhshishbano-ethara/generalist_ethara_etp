openapi: 3.0.3
info:
  title: Ethara ETP API
  description: |
    REST API documentation for Ethara ETP platform.

    ## Authentication
    Most endpoints require a custom token-based authentication.
    - Call `POST /api/v1/auth_token` to get an `access_token` and `refresh_token`.
    - Pass the `access_token` in the request header for all protected endpoints.
    - When the access token expires, call `POST /api/v1/refresh_token` with the `refresh_token`.

    ## Response Format
    All responses follow this structure:
    ```json
    {
      "message": "Success",
      "status_code": 200,
      "errors": [],
      ...data fields
    }
    ```
  version: 1.0.0
  contact:
    name: Ethara ETP Team

servers:
  - url: /
    description: Current Odoo Instance

tags:
  - name: Authentication
    description: Login, logout, token management
  - name: User Profile
    description: User profile and settings
  - name: Notifications
    description: In-app notification management
  - name: Projects
    description: Project CRUD and management
  - name: Project Portal
    description: PL / AIRE / SWE portal updates
  - name: Dashboards
    description: Role-based dashboards (CTO, PL, AIRE, SWE)
  - name: Employees & Members
    description: Employee list and WhatsApp members
  - name: User Settings
    description: Appearance, notification preferences
  - name: Reports
    description: Export reports
  - name: AI Services
    description: AI document extraction
  - name: Valor
    description: Valor LLM evaluation pipeline
  - name: Preference Ranking
    description: Preference ranking LLM evaluation pipeline
  - name: Vindex Portal
    description: Vindex annotation portal APIs
  - name: WhatsApp Webhook
    description: WhatsApp Cloud API webhook handlers
  - name: Blockers
    description: Project blocker management
  - name: TaskForge Users
    description: TaskForge user management (users, team, PLS, QRs)
  - name: TaskForge Leaves
    description: TaskForge leave management (apply, approve, reject)
  - name: TaskForge Attendance
    description: TaskForge attendance tracking (punch in/out)
  - name: TaskForge Projects
    description: TaskForge project and allocation management
  - name: TaskForge Tasks
    description: TaskForge task logging and tracking
  - name: TaskForge Bugs
    description: TaskForge bug reports and validation
  - name: TaskForge Flags
    description: TaskForge flag management
  - name: TaskForge Analytics
    description: TaskForge analytics and productivity metrics
  - name: TaskForge Files
    description: TaskForge file uploads and exports
  - name: Preference Ranking API
    description: Preference Ranking REST API for tasks and evaluations
  - name: Slack Integration
