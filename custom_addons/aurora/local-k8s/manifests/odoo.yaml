apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: aurora
data:
  odoo.conf: |
    [options]
    admin_passwd = admin
    db_host = postgres.aurora.svc.cluster.local
    db_port = 5432
    db_user = odoo
    db_password = odoo_local_pw
    db_name = odoo
    addons_path = /opt/odoo/addons,/opt/odoo/custom_addons
    data_dir = /tmp/odoo-data
    server_wide_modules = base,web
    without_demo = all
    workers = 0
    limit_time_cpu = 600
    limit_time_real = 1200
    max_cron_threads = 1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-data-pvc
  namespace: aurora
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: aurora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
    spec:
      containers:
        - name: odoo
          image: aurora-odoo:local
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              python /opt/odoo/odoo-bin --config=/etc/odoo/odoo.conf \
                --init=base,web,aurora --stop-after-init --no-http 2>&1 || true
              exec python /opt/odoo/odoo-bin --config=/etc/odoo/odoo.conf
          ports:
            - containerPort: 8069
            - containerPort: 8072
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aurora-local-env
                  key: DB_PASSWORD
            - name: AURORA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: aurora-local-env
                  key: AURORA_ENCRYPTION_KEY
            - name: AURORA_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aurora-local-env
                  key: AURORA_S3_ACCESS_KEY
            - name: AURORA_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aurora-local-env
                  key: AURORA_S3_SECRET_KEY
            - name: AURORA_WEBHOOK_URL
              value: "http://odoo.aurora.svc.cluster.local:8069"
            - name: AURORA_S3_ENDPOINT
              value: "http://minio.aurora.svc.cluster.local:9000"
            - name: AURORA_DOCKER_IMAGE
              value: "aurora-worker:local"
            - name: AURORA_LOCAL_MODE
              value: "1"
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo/odoo.conf
              subPath: odoo.conf
              readOnly: true
            - name: odoo-data
              mountPath: /tmp/odoo-data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: odoo-config
          configMap:
            name: odoo-config
        - name: odoo-data
          persistentVolumeClaim:
            claimName: odoo-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: aurora
spec:
  type: NodePort
  selector:
    app: odoo
  ports:
    - port: 8069
      targetPort: 8069
      nodePort: 30069
      name: http
    - port: 8072
      targetPort: 8072
      name: longpolling
