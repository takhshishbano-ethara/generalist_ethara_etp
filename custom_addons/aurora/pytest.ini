[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -q --import-mode=importlib --ignore=tests/test_credential_manager.py --ignore=tests/test_evaluation.py --ignore=tests/test_evaluation_executor.py --ignore=tests/test_expanded.py --ignore=tests/test_github_token.py --ignore=tests/test_import_tokens_wizard.py --ignore=tests/test_pool_metrics.py --ignore=tests/test_done_repo_sync_orm.py
