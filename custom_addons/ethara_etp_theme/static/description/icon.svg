<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
        <linearGradient id="ethara-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
        <linearGradient id="ethara-bar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#eef2ff"/>
        </linearGradient>
        <filter id="ethara-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="2" result="off"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="256" height="256" rx="56" fill="url(#ethara-bg)"/>

    <circle cx="208" cy="48" r="64" fill="#ffffff" opacity="0.08"/>
    <circle cx="40" cy="216" r="48" fill="#ffffff" opacity="0.06"/>

    <rect x="56" y="60" width="8" height="136" rx="4" fill="#ffffff" opacity="0.85"/>

    <g filter="url(#ethara-shadow)">
        <rect x="80" y="64" width="120" height="24" rx="7" fill="url(#ethara-bar)"/>
        <rect x="80" y="116" width="88"  height="24" rx="7" fill="#c7d2fe"/>
        <rect x="80" y="168" width="120" height="24" rx="7" fill="url(#ethara-bar)"/>
    </g>

    <circle cx="184" cy="128" r="6" fill="#ffffff"/>
</svg>
