[project]
name = "milo-rl"
version = "0.1.0"
description = "MILO-bench RL training pipeline extending verl for long-horizon coding tasks"
requires-python = ">=3.10"
dependencies = [
    "verl>=0.3.0",
    "vllm>=0.6.0",
    "torch>=2.4.0",
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "datasets>=2.18",
    "peft>=0.12",
    "transformers>=4.44",
    "docker>=7.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
