# Vegeta PRD — OPTIONAL Kueue queue (opt-in).
#
# Kueue is OFF by default. The PRD dispatch code only adds the
# `kueue.x-k8s.io/queue-name` label to a Job when the Odoo config parameter
# `vegeta.kueue_queue` is set to a non-empty value. If you set that parameter
# WITHOUT a matching Kueue LocalQueue in the cluster, every PRD Job is
# admission-gated by Kueue and stays suspended forever.
#
# Use this manifest only if you actually want Kueue admission control:
#   1. Install Kueue in the cluster (https://kueue.sigs.k8s.io/).
#   2. kubectl apply -f custom_addons/vegeta/deploy/vegeta-kueue-localqueue.yaml
#   3. Set the Odoo config parameter `vegeta.kueue_queue` to `vegeta-prd`
#      (must match the LocalQueue metadata.name below).
#
# The names/quotas here are a starting point — tune them for your cluster.
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: vegeta-default-flavor
  labels:
    app.kubernetes.io/managed-by: vegeta-odoo
    platform: vegeta
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: vegeta-prd-cluster-queue
  labels:
    app.kubernetes.io/managed-by: vegeta-odoo
    platform: vegeta
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: vegeta-default-flavor
          resources:
            - name: "cpu"
              nominalQuota: "64"
            - name: "memory"
              nominalQuota: "256Gi"
---
# LocalQueue name MUST equal the `vegeta.kueue_queue` config parameter value.
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: vegeta-prd
  namespace: vegeta
  labels:
    app.kubernetes.io/managed-by: vegeta-odoo
    platform: vegeta
spec:
  clusterQueue: vegeta-prd-cluster-queue
