# Vegeta PRD K8s-Job RBAC — apply once per cluster.
#
#   kubectl apply -f custom_addons/vegeta/deploy/vegeta-prd-rbac.yaml
#
# See deploy/README.md for the full procedure and the TODO(devops) items
# that must be answered before applying (Odoo backend ServiceAccount name +
# namespace, ECR repo, IRSA role ARNs).
---
apiVersion: v1
kind: Namespace
metadata:
  name: vegeta
  labels:
    app.kubernetes.io/managed-by: vegeta-odoo
    platform: vegeta
---
# ServiceAccount the PRD worker pods run as. The worker only needs to reach
# Postgres + the Bedrock/S3 HTTPS APIs; it never calls the K8s API itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vegeta-worker
  namespace: vegeta
  labels:
    app.kubernetes.io/managed-by: vegeta-odoo
    platform: vegeta
  # TODO(devops): if Bedrock/S3 auth should use an IRSA pod role instead of
  # the access keys passed via the per-job Secret (plan Open Question Q4),
  # add the role-ARN annotation below and grant it bedrock:InvokeModel +
  # s3:GetObject/PutObject on the vegeta bucket.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/vegeta-prd-worker
---
# Grants the Odoo backend permission to create/inspect/delete the per-job
# Jobs, Secrets and ConfigMaps that the PRD dispatch + reconcile crons manage.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vegeta-prd-dispatcher
  namespace: vegeta
  labels:
    app.kubernetes.io/managed-by: vegeta-odoo
    platform: vegeta
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vegeta-prd-dispatcher
  namespace: vegeta
  labels:
    app.kubernetes.io/managed-by: vegeta-odoo
    platform: vegeta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vegeta-prd-dispatcher
subjects:
  # TODO(devops): set this to the ServiceAccount the Odoo backend pods run as.
  # The plan assumes the existing Ethara EKS cluster; the Odoo SA name and
  # namespace are not knowable from the addon source (plan Open Question Q1).
  - kind: ServiceAccount
    name: REPLACE_WITH_ODOO_SERVICEACCOUNT
    namespace: REPLACE_WITH_ODOO_NAMESPACE
