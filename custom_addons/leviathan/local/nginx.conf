# Tiny round-robin proxy so the local rig can drive >1 concurrent
# Lambda invocation. The AWS Lambda Runtime Interface Emulator (RIE)
# embedded in the official lambda images ONLY HANDLES ONE INVOCATION
# AT A TIME — concurrent invokes hit ``ReserveFailed: AlreadyReserved``
# and the rapidcore goroutine SEGV-panics the container. See
# STAGED_REVIEW.md and the leviathan-extraction GitHub issue tracker.
#
# Production AWS Lambda has elastic concurrency; this proxy is local-
# only and gets dropped when the rig points at real AWS.
#
# Topology:
#   Odoo (host) --> nginx:9000 --> [lambda1, lambda2, ..., lambdaN]:8080
#
# Each backend lambda container is a single-invocation worker. nginx
# round-robins; if a backend is busy it returns 502 immediately and
# nginx tries the next one (``proxy_next_upstream``).

worker_processes  1;
events { worker_connections 1024; }

http {
  # Each lambda backend is a single worker. ``max_fails=0`` keeps them
  # in rotation even after a transient failure (we want the next
  # invocation to land on the next backend, not blacklist the busy
  # one). ``max_conns=1`` is critical — it tells nginx to send at
  # most one in-flight request to each backend, matching the RIE's
  # actual capacity.
  upstream lambdas {
    server leviathan-lambda-1:8080 max_fails=0 max_conns=1;
    server leviathan-lambda-2:8080 max_fails=0 max_conns=1;
    server leviathan-lambda-3:8080 max_fails=0 max_conns=1;
    server leviathan-lambda-4:8080 max_fails=0 max_conns=1;
    server leviathan-lambda-5:8080 max_fails=0 max_conns=1;
    # nginx will queue requests beyond per-backend max_conns until a
    # slot opens, OR return 502 if ``proxy_next_upstream`` has run
    # through all backends.
    keepalive 32;
  }

  # Lambda RIE can take up to its ``AWS_LAMBDA_FUNCTION_TIMEOUT``
  # before responding (default 900s in our compose). nginx needs
  # generous read/send timeouts so it doesn't kill long extractions.
  proxy_connect_timeout 10s;
  proxy_send_timeout 900s;
  proxy_read_timeout 900s;
  client_max_body_size 16m;

  # If a backend returns 502 / 503 / 504, try the next one. After
  # one round of retries through all backends, surface the failure.
  # ``non_idempotent`` because Lambda POSTs are not idempotent in
  # general, but we accept the trade-off here because the failure
  # mode is "RIE is busy" not "side effect already applied".
  proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
  proxy_next_upstream_tries 5;
  proxy_next_upstream_timeout 0;

  server {
    listen 9000;

    # AWS Lambda runtime contract path. Odoo's extraction service
    # POSTs to this URL.
    location /2015-03-31/functions/function/invocations {
      proxy_pass http://lambdas;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }

    location / {
      return 404 '{"error":"only /2015-03-31/functions/function/invocations is proxied"}\n';
      default_type application/json;
    }
  }
}
