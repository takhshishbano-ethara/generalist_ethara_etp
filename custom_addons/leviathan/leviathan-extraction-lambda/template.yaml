AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Leviathan Extraction Service — Playwright-based website extraction pipeline (250 concurrent, async invoke)

Globals:
  Function:
    Timeout: 900
    MemorySize: 4096
    # Playwright + Chromium + a full extraction's screenshots/assets need far
    # more than the 512 MB /tmp default — too little causes
    # "ENOSPC: no space left on device" on browser launch.
    EphemeralStorage:
      Size: 4096

Parameters:
  LeviathanWebhookToken:
    Type: String
    NoEcho: true
    Description: Token sent as X-Leviathan-Token header in callbacks to Odoo
  S3Bucket:
    Type: String
    Default: ""
    Description: S3 bucket for artifact storage
  S3Region:
    Type: String
    Default: us-east-1
    Description: AWS region for S3

Resources:
  ExtractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Environment:
        Variables:
          LEVIATHAN_WEBHOOK_TOKEN: !Ref LeviathanWebhookToken
          S3_BUCKET: !Ref S3Bucket
          S3_REGION: !Ref S3Region
      Events:
        ExtractApi:
          Type: HttpApi
          Properties:
            Path: /api/v1/extract
            Method: POST
        HealthApi:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket
      ReservedConcurrentExecutions: 250
      # Async (Event) invokes are auto-retried by AWS on Lambda
      # timeout/error — without this, a single timed-out extraction silently
      # re-runs up to 2 more times (3x cost, duplicate callbacks). The handler
      # already sends an honest failure callback, so no retry is wanted.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 1800
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

Outputs:
  ExtractionApi:
    Description: API Gateway endpoint URL (for health checks only)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionUrl:
    Description: Lambda Function URL (SigV4 auth - give this to Odoo)
    Value: !GetAtt ExtractionFunctionUrl.FunctionUrl
  ExtractionFunction:
    Description: Lambda Function ARN
    Value: !GetAtt ExtractionFunction.Arn
